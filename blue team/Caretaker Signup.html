<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HNS - Caretaker Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="caretaker-signup">

    <div class="page">

        <header>

            <div class="logo">
                <svg width="45" height="38" viewBox="0 0 50 45">
                    <path d="M22 13 C15 0, 0 9, 7 22 L22 37 L37 22 C44 9, 29 0, 22 13"
                          fill="none"
                          stroke="#00B9C7"
                          stroke-width="3"/>

                    <path d="M32 18 C25 5, 12 14, 17 26 L32 41 L45 26 C52 14, 39 5, 32 18"
                          fill="none"
                          stroke="#00B9C7"
                          stroke-width="3"/>
                </svg>
            </div>

            <!-- Navigation Menu -->

            <nav class="site-navigation">

                <details class="nav-dropdown">

                    <summary class="menu">&#9776;</summary>

                    <div class="nav-links">

<a href="index.html">Home</a>

                    </div>

                </details>

            </nav>

        </header>

        <main>

            <section class="signup-section">

                <h1>HNS</h1>

                <h2>Make it Easier with HNS</h2>

                <div class="welcome">

                    <h3>Welcome, Caregiver!</h3>

                    <p>
                        Create your caregiver account to stay<br>
                        connected and support your loved ones
                    </p>

                </div>

                <div class="signup-box">

                    <p class="form-title">Sign Up</p>

                    <form action="caretaker signup.php" method="POST">

                        <input
                            type="text"
                            name="username"
                            placeholder="HNS Username"
                            required
                        >

                        <input
                            type="email"
                            name="email"
                            placeholder="Email Address"
                            required
                        >

                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                        >

                        <input
                            type="password"
                            name="confirm_password"
                            placeholder="Re-Enter your Password"
                            required
                        >

                        <button type="submit">
                            Sign up
                        </button>

                    </form>

                </div>

            </section>

            <section class="image-section">

                <img
                    src="caregiver.png"
                    alt="Caregiver helping an elderly woman"
                >

            </section>

        </main>

    </div>

</body>
</html>
